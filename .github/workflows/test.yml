name: ci

on: [push]

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install Huff
        uses: huff-language/huff-toolchain@v2
        with:
          version: nightly
      - name: Run Forge build
        run: forge --version && forge build --sizes
        id: build

  tests:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install Huff
        uses: huff-language/huff-toolchain@v2
        with:
          version: nightly
      - name: Run Forge tests
        run: forge test -vvv
        id: test

  huff-tests:
    name: Tests in Huff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install Huff
        uses: huff-language/huff-toolchain@v2
        with:
          version: nightly
      - name: Huff Tests
        uses: huff-language/huff-tests-action@v3
        with:
          with-location: "src"
          with-extension: "*.huff"
          with-format: "table"

  btt:
    name: Test trees (btt)
    runs-on: ubuntu-latest
    env:
      BTT_VERSION: v0.2.0
      BTT_SHA256: 2b80ad4cf92390e21de1546b95e86c8acfd04a5375d37f86c23001ac68c09b48
    steps:
      - uses: actions/checkout@v3
      - name: Install btt
        run: |
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -LsSfO "https://github.com/Maddiaa0/btt/releases/download/${BTT_VERSION}/btt-cli-x86_64-unknown-linux-gnu.tar.xz"
          echo "${BTT_SHA256}  btt-cli-x86_64-unknown-linux-gnu.tar.xz" | sha256sum -c -
          tar xJf btt-cli-x86_64-unknown-linux-gnu.tar.xz
          echo "$RUNNER_TEMP/btt-cli-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Check .tree specs
        run: btt --version && btt check test
